# Игра как библиотека для Android: код тот же (`src/main.rs`), но отдельный пакет, поэтому обычная
# сборка не меняется и не становится медленнее. Собирает `scripts/build-android.sh`.
# Зависимости держать в согласии с корневым Cargo.toml; их версии скрипт берёт из корневого Cargo.lock.
[package]
name = "space_guard_android"
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "space_guard"
path = "../src/main.rs"
crate-type = ["cdylib"]

[dependencies]
# NativeActivity не требует Java-кода, поэтому APK собирается без Gradle.
bevy = { version = "0.20.1", features = ["mp3", "android-native-activity"] }
bevy_hanabi = "0.20"
bevy_trauma_shake = "0.9"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meshopt = "0.7"
# Имя и производитель геймпада: их знает только Java-класс InputDevice.
jni = "0.21"
# Имя GPU для уровня устройства (`src/android.rs`) до запуска Bevy: та же версия, что у Bevy, без
# своих возможностей — их задаёт Bevy.
wgpu = { version = "30.0.2", default-features = false }

# android-activity — копия с фильтром ввода для геймпада, её готовит scripts/build-android.sh.
# bevy_audio — та же копия, что в обычной сборке (Cargo.toml игры).
[patch.crates-io]
android-activity = { path = "../target/android/patched/android-activity" }
bevy_audio = { path = "../vendor/bevy_audio" }
wgpu-hal = { path = "../vendor/wgpu-hal" }

[profile.release]
# Крейт игры компилируется параллельно: сборка быстрее, игра почти не медленнее.
codegen-units = 16
strip = true
