[package]
name = "space_guard"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
description = "Game Jam Karlsruhe 2026: луноход на неизвестной планете, аркадный 3D-шутер"
publish = false

[dependencies]
# mp3 нужен для реплик штаба из ElevenLabs.
bevy = { version = "0.20.1", features = ["mp3"] }
# GPU-частицы: взрывы, дым, искры.
bevy_hanabi = "0.20"
# Тряска камеры при взрывах.
bevy_trauma_shake = "0.9"
# Шум для генерации ландшафта от сида.
noise = "0.9"
# Чтение списка реплик штаба из JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Упрощение сеток моделей на телефоне (`src/lod.rs`): meshoptimizer, библиотека на C++,
# поэтому не в браузерной сборке.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = "0.7"

# Браузерная сборка (`scripts/build-web.sh`): частицы bevy_hanabi считаются вычислительными
# шейдерами, поэтому нужен WebGPU, а не WebGL2. На нативную сборку секция не влияет.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", features = ["webgpu"] }
# Часы браузера для сидов: `std::time::SystemTime` в WASM нет.
js-sys = "0.3"
# Реплики и музыку в браузере играет аудиоэлемент страницы (`src/web_audio.rs`).
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["AudioContext", "BaseAudioContext", "AudioNode", "AudioParam", "GainNode", "AudioDestinationNode", "MediaElementAudioSourceNode", "HtmlAudioElement", "HtmlMediaElement", "HtmlElement", "Element", "Document", "Window", "EventTarget"] }

# Вибрация и световая панель геймпада на macOS (`src/haptics.rs`): gilrs там вибрацию не умеет,
# а системный GameController с CoreHaptics умеет (DualShock 4, DualSense, Xbox).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSError", "NSSet", "NSValue", "NSObject"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCDevice", "GCDeviceHaptics", "GCDeviceLight", "GCColor", "GCExtendedGamepad", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput", "GCControllerElement", "GCPhysicalInputProfile", "objc2-core-haptics"] }
objc2-core-haptics = { version = "0.3", default-features = false, features = ["std", "CHHapticEngine", "CHHapticPattern", "CHHapticEvent", "CHHapticParameter", "CHHapticPatternPlayer", "CHHapticDeviceCapability"] }

# iOS (`scripts/build-ios.sh`): геймпад и вибрация — тот же GameController, что на macOS;
# безопасная область экрана — у вида окна UIKit (`src/ios.rs`).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSError", "NSSet", "NSValue", "NSObject"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCDevice", "GCDeviceHaptics", "GCDeviceLight", "GCColor", "GCExtendedGamepad", "GCControllerButtonInput", "GCControllerDirectionPad", "GCControllerAxisInput", "GCControllerElement", "GCPhysicalInputProfile", "objc2-core-haptics"] }
objc2-core-haptics = { version = "0.3", default-features = false, features = ["std", "CHHapticEngine", "CHHapticPattern", "CHHapticEvent", "CHHapticParameter", "CHHapticPatternPlayer", "CHHapticDeviceCapability"] }
raw-window-handle = "0.6"

# Быстрые инкрементальные сборки: свой код почти без оптимизаций, зависимости с полными.
[profile.dev]
# Код игры оптимизирован полностью: иначе отладочная сборка тормозит.
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Браузерная сборка для выкладки (`scripts/build-web.sh --release`, GitHub Pages): как release,
# но крейт игры компилируется параллельно — без этого он один собирается на раннере 6 минут.
[profile.web]
inherits = "release"
codegen-units = 16

# Своя копия bevy_audio 0.20.1: вывод звука переоткрывается, когда устройство пропало или сменилось
# (наушники отключились и вернулись). Правка — vendor/bevy_audio/PATCH.md.
[patch.crates-io]
bevy_audio = { path = "vendor/bevy_audio" }
