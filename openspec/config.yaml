schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: игра для Game Jam Karlsruhe 2026 (https://gamejam-karlsruhe.hackops.tech/).
  Jam однодневный, 14.11.2026: хакинг с 10:30, сдача до 17:00, затем 3-минутный
  тизер без слайдов (только игра) и Open Arcade, где все играют в игры друг друга.
  Команда до 4 человек.

  Идея (название Space Guard): луноход попадает на неизвестную планету и,
  как в аркаде, уничтожает врагов, всё сильнее разрушая планету. Требования к игре
  собраны в docs/requirements.md: решения, допущения и приоритеты. Они нарезаны на
  OpenSpec-изменения в openspec/changes/. В коде пока заглушка сцены и голос штаба
  (изменение voice-lines реализовано).

  Изменения зависят друг от друга цепочкой. Реализовывать и архивировать их в порядке:
  terrain-rover-camera → mortar-craters → combat-basics → screens-records →
  buildings-destruction → arsenal → waves-alarm → railway → residents → voice-lines →
  audio-minimap → visual-style → lava.
  terrain-rover-camera и screens-records оба меняют требование app-shell «Стартовая
  сцена», поэтому архивировать их строго в этом порядке.

  Принятые решения по устройству:
  - Списки ресурсов (реплики, звуки, музыка, модели) — JSON рядом с файлами, разбор
    через serde_json, как в voice-lines.
  - Звук вызывается сообщением с идентификатором; одновременно звучит одна реплика
    штаба, новая обрывает текущую.
  - Всё, что хранит состояние мира или забега, сбрасывается по сообщению перестройки мира `WorldRebuilt`.

  Стек:
  - Rust 1.99 (закреплён в rust-toolchain.toml), edition 2024.
  - Bevy 0.20.1, 3D, ECS; новые механики оформлять как Bevy-плагины.
  - Сборка только нативная (`cargo run`): сейчас macOS, позже Linux. Браузерная сборка отложена.

  Ограничения jam:
  - Организаторы принимают ссылку на игру, опубликованную на Rosebud (браузерный
    конструктор игр). Наша игра нативная, браузерная сборка отложена.
  - Инструменты jam: Meshy (3D-модели), ElevenLabs (голос, звуки, музыка).

  Принципы:
  - Времени несколько часов: играбельность важнее архитектуры, без лишних абстракций.
  - Каждое изменение оставляет игру собираемой и запускаемой.

rules:
  tasks:
    - Каждая задача занимает не больше часа и заканчивается собираемой игрой (`cargo build`).

