# Браузерная сборка игры (WASM + WebGPU) и выкладка на GitHub Pages.
#
# Запускается раз в 4 часа по расписанию (на ветке main) и собирает, только если в main есть
# коммиты после последней успешной выкладки. Сборка — не чаще раза в 4 часа при любом запуске,
# и ручном тоже (Actions → web → Run workflow): если с начала прошлой сборки прошло меньше
# 3 ч 50 мин, запуск ничего не собирает (10 минут — допуск на неточность расписания GitHub).
# Сборку делает тот же scripts/build-web.sh, что и локально.
name: web

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Чтение прошлых запусков: с какого коммита была последняя сборка.
  actions: read
  # Выкладка в Pages: права на Pages и OIDC.
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Были ли изменения в main после последней успешной сборки.
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          # Не чаще раза в 4 часа; 10 минут — допуск на неточность расписания GitHub.
          MIN_INTERVAL: 13800
        run: |
          now=$(date -u +%s)
          last_built=""
          last_deployed=""
          # Прошлые запуски, кроме этого: когда последний раз собирали и с какого коммита выложили.
          while read -r run created; do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            jobs=$(gh run view -R "$GITHUB_REPOSITORY" "$run" --json jobs \
              --jq '.jobs[] | "\(.name)=\(.conclusion)"')
            # Сборка была (идёт, прошла или упала), если её задача не пропущена.
            if [ -z "$last_built" ] && echo "$jobs" | grep -q '^build=' && ! echo "$jobs" | grep -qx 'build=skipped'; then
              last_built=$(date -u -d "$created" +%s)
            fi
            if [ -z "$last_deployed" ] && echo "$jobs" | grep -qx 'deploy=success'; then
              last_deployed=$(gh run view -R "$GITHUB_REPOSITORY" "$run" --json headSha --jq .headSha)
            fi
            [ -n "$last_built" ] && [ -n "$last_deployed" ] && break
          done < <(gh run list -R "$GITHUB_REPOSITORY" --workflow web.yml --limit 30 \
            --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"')

          if [ -n "$last_built" ] && [ $((now - last_built)) -lt "$MIN_INTERVAL" ]; then
            echo "прошлая сборка $(( (now - last_built) / 60 )) мин назад: не чаще раза в 4 часа, пропускаем"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "main: $GITHUB_SHA, последняя выкладка: ${last_deployed:-нет}"
          if [ "$last_deployed" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Тулчейн из rust-toolchain.toml и цель WASM.
      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      # .cargo/config.toml линкует на Linux через clang и mold: так собираются
      # build-скрипты и proc-macro под сам раннер.
      - name: clang, mold и Pillow
        run: sudo apt-get update && sudo apt-get install -y clang mold python3-pil

      # wasm-bindgen-cli той же версии, что крейт wasm-bindgen в Cargo.lock.
      - name: Версия wasm-bindgen
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      # Кэш зависимостей: без него каждая сборка компилирует Bevy с нуля.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-web

      - name: Сборка
        run: scripts/build-web.sh --release

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
