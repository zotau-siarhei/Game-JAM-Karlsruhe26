<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Guard</title>
  <!-- Установка на экран «Домой»: игра открывается без интерфейса браузера (на iPhone это
       единственный способ получить полный экран). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space Guard">
  <style>
    /* Шрифт меню игры: FiraMono из Bevy (лицензия OFL), в нём только латиница. */
    @font-face {
      font-family: "Space Guard Mono";
      src: url("FiraMono-subset.ttf") format("truetype");
      font-display: block;
    }

    :root {
      /* Цвета меню игры: заголовок TITLE_COLOR, подсказки HINT_COLOR, панели PANEL_COLOR (src/run.rs, src/hud.rs). */
      --title: rgb(255 217 77);
      --hint: rgb(204 204 204);
      --dim: rgb(204 204 204 / 0.55);
      --panel: rgb(0 0 0 / 0.65);
      --danger: rgb(255 89 64);
      --mono: "Space Guard Mono", "Fira Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    /* Игра занимает всю страницу: холст растягивается по окну, полос прокрутки нет. */
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      /* Видимая высота: на телефоне без части, закрытой строкой адреса. */
      height: 100dvh;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
    }

    /* Кнопка полного экрана: поверх игры в правом верхнем углу, вне вырезов экрана. */
    #fullscreen {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      z-index: 20;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgb(255 255 255 / 0.18);
      border-radius: 8px;
      background: rgb(0 0 0 / 0.45);
      color: rgb(255 255 255 / 0.85);
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.2s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #fullscreen:hover, #fullscreen:focus-visible {
      opacity: 1;
      background: rgb(0 0 0 / 0.7);
      outline: none;
    }
    #fullscreen[hidden] { display: none; }
    #fullscreen svg { width: 22px; height: 22px; }
    #fullscreen .exit { display: none; }
    :root.is-fullscreen #fullscreen .enter { display: none; }
    :root.is-fullscreen #fullscreen .exit { display: block; }

    /* Подсказка для iPhone: полный экран страницам там не дают, только установка на «Домой». */
    #install-hint {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 62px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
      z-index: 20;
      max-width: min(320px, calc(100vw - 20px));
      padding: 12px 14px;
      border: 1px solid rgb(255 255 255 / 0.18);
      border-radius: 8px;
      background: var(--panel);
      color: #fff;
      font: 14px/1.4 var(--mono);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #install-hint.shown { opacity: 1; transform: none; }
    #install-hint b { color: var(--title); font-weight: normal; }
    /* Холст в обёртке: на телефоне обёртка меньше окна в --scale раз и растянута обратно
       через transform. Холст считает пиксели по размеру обёртки, поэтому игра рисует меньше
       пикселей, а на экране занимает всё окно. На компьютере --scale = 1. */
    #viewport {
      --scale: 1;
      position: fixed;
      left: 0;
      top: 0;
      width: calc(100% / var(--scale));
      height: calc(100% / var(--scale));
      transform: scale(var(--scale));
      transform-origin: 0 0;
    }
    #space-guard {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Экран загрузки поверх игры. Пока игра не рисует, фон — ночное небо; когда она
       запустилась, сквозь размытую дымку виден облёт планеты из меню. */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      font-family: var(--mono);
      color: var(--hint);
      text-transform: uppercase;
      user-select: none;
      cursor: default;
      background:
        radial-gradient(1px 1px at 12% 22%, #fff8 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 14%, #fff6 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 64% 72%, #fff7 50%, transparent 51%),
        radial-gradient(1px 1px at 28% 81%, #fff5 50%, transparent 51%),
        radial-gradient(1px 1px at 88% 58%, #fff6 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 42% 9%, #fff5 50%, transparent 51%),
        radial-gradient(ellipse at 50% 120%, rgb(40 90 60 / 0.55), transparent 60%),
        radial-gradient(ellipse at 50% 40%, #0b1424, #020409 75%);
      transition: background-color 1.2s ease, opacity 0.7s ease, backdrop-filter 1.2s ease;
    }
    #loader.live {
      background: rgb(2 4 9 / 0.72);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
    }
    #loader.leaving {
      opacity: 0;
      pointer-events: none;
    }

    .title {
      margin: 0;
      font-size: clamp(40px, 9vw, 96px);
      font-weight: normal;
      letter-spacing: 0.06em;
      color: var(--title);
      text-shadow: 0 0 24px rgb(255 217 77 / 0.35), 0 4px 0 rgb(0 0 0 / 0.6);
    }
    .subtitle {
      margin: 8px 0 0;
      font-size: clamp(13px, 1.8vw, 20px);
      letter-spacing: 0.12em;
      color: var(--hint);
    }

    .panel {
      width: min(560px, 100%);
      margin-top: clamp(32px, 7vh, 72px);
      padding: 20px 22px 18px;
      box-sizing: border-box;
      background: var(--panel);
      border: 1px solid rgb(255 255 255 / 0.08);
      border-radius: 6px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    #stage {
      color: var(--title);
    }
    #percent {
      font-size: 22px;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      position: relative;
      height: 6px;
      margin: 12px 0 10px;
      background: rgb(255 255 255 / 0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    #fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, rgb(255 170 40), var(--title));
      box-shadow: 0 0 12px rgb(255 217 77 / 0.6);
      border-radius: 3px;
      transition: width 0.25s ease-out;
    }
    /* Бегущий блик по полосе, пока идёт загрузка. */
    #fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 0.55), transparent);
      transform: translateX(-100%);
      animation: shine 1.4s ease-in-out infinite;
    }
    #loader.ready #fill::after {
      animation: none;
    }
    @keyframes shine {
      to { transform: translateX(100%); }
    }

    #file {
      min-height: 1.3em;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #counts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgb(255 255 255 / 0.08);
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    #counts div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #counts b {
      font-weight: normal;
      font-size: 14px;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    #counts .done b {
      color: var(--title);
    }
    #counts span {
      color: var(--dim);
    }

    #tip {
      min-height: 1.4em;
      margin-top: 28px;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: var(--hint);
      text-align: center;
      white-space: pre;
      transition: opacity 0.4s ease;
    }
    #tip.fade {
      opacity: 0;
    }

    #start {
      margin-top: 28px;
      font-size: clamp(16px, 2.2vw, 24px);
      letter-spacing: 0.12em;
      color: #fff;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #loader.ready #start {
      opacity: 1;
      transform: none;
      animation: pulse 1.6s ease-in-out 0.5s infinite;
    }
    #loader.ready {
      cursor: pointer;
    }
    @keyframes pulse {
      50% { opacity: 0.45; }
    }

    #loader.failed #stage,
    #loader.failed #file {
      color: var(--danger);
    }

    @media (max-width: 480px) {
      #counts {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #fill::after, #loader.ready #start {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="viewport"><canvas id="space-guard" tabindex="0"></canvas></div>

  <button id="fullscreen" type="button" aria-label="Full screen" title="Full screen" hidden>
    <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
    <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
    </svg>
  </button>
  <div id="install-hint" role="status">To play full screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</div>

  <div id="loader" role="dialog" aria-label="Space Guard loading">
    <h1 class="title">SPACE GUARD</h1>
    <p class="subtitle">Survive as long as you can</p>

    <div class="panel" aria-live="polite">
      <div class="row">
        <span id="stage">Loading engine</span>
        <span id="percent">0%</span>
      </div>
      <div class="bar"><div id="fill"></div></div>
      <div class="row">
        <span id="file">&nbsp;</span>
        <span id="bytes"></span>
      </div>
      <div id="counts">
        <div data-kind="sfx"><span>Sound FX</span><b>0/0</b></div>
        <div data-kind="voice"><span>HQ radio</span><b>0/0</b></div>
        <div data-kind="music"><span>Music</span><b>0/0</b></div>
        <div data-kind="models"><span>Models</span><b>0/0</b></div>
      </div>
    </div>

    <div id="tip"></div>
    <div id="start">Click or press any key to start</div>
  </div>

  <script>
    // Выполняется до модуля игры: её обвязка берёт AudioContext и fetch при импорте.
    (() => {
      // --- Звук ---
      // Браузер не даёт звуку играть до первого нажатия на странице: звук игры создаётся сразу
      // при запуске и остаётся приостановленным. Запоминаем каждый AudioContext и будим его
      // нажатием (на экране загрузки — тем же нажатием, что закрывает экран).
      const audioContexts = [];
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      if (NativeAudioContext) {
        window.AudioContext = class extends NativeAudioContext {
          constructor(...args) {
            super(...args);
            audioContexts.push(this);
          }
        };
      }
      const resumeAudio = () => {
        for (const context of audioContexts) {
          if (context.state !== "running") context.resume();
        }
      };
      // На сенсорном экране жест, который разрешает звук, — отпускание пальца (pointerup, touchend).
      for (const event of ["pointerdown", "pointerup", "keydown", "touchstart", "touchend"]) {
        document.addEventListener(event, resumeAudio, { capture: true });
      }

      // --- Шейдеры для WebKit (Safari, все браузеры на iOS) ---
      // Шейдеры PBR в Bevy 0.20 кладут текстуру и сэмплер в let:
      //   let texture = pbr_bindings::base_color_texture;
      // Chrome это пропускает, WebKit отклоняет («'texture_2d<f32>' cannot be used as the type
      // of a 'let'»), и Bevy останавливает игру. Перед компиляцией подставляем саму глобальную
      // текстуру вместо такого let — в пределах блока, где он объявлен.
      function inlineHandleLets(code) {
        const handles = new Set();
        const globalVar = /\bvar\s+(\w+)\s*:\s*(?:texture_|sampler|binding_array)/g;
        for (let m; (m = globalVar.exec(code)); ) handles.add(m[1]);
        if (!handles.size) return code;
        const letHandle = /\blet\s+(\w+)\s*=\s*([A-Za-z_]\w*(?:\[[^\];]*\])?)\s*;/g;
        let out = "";
        let from = 0;
        for (let m; (m = letHandle.exec(code)); ) {
          const [whole, name, value] = m;
          if (!handles.has(value.split("[")[0])) continue;
          // Конец блока, в котором объявлен let: первая непарная закрывающая скобка.
          let depth = 0;
          let end = code.length;
          for (let i = m.index + whole.length; i < code.length; i++) {
            if (code[i] === "{") depth++;
            else if (code[i] === "}" && depth-- === 0) { end = i; break; }
          }
          const scope = code.slice(m.index + whole.length, end)
            .replace(new RegExp(`(?<![.\\w])${name}\\b`, "g"), value);
          code = code.slice(0, m.index) + scope + code.slice(end);
          letHandle.lastIndex = m.index;
        }
        return code;
      }
      // --- Тени точечных источников (Android, Adreno) ---
      // Компилятор шейдеров Adreno (Vulkan) падает на textureSampleCompareLevel по массиву
      // кубических карт глубины: процесс видеокарты Chrome умирает на первом же PBR-конвейере,
      // игра теряет устройство («A valid external Instance reference no longer exists»).
      // У всех точечных источников в игре тени выключены, выборка всё равно дала бы 1.0 —
      // её и подставляем, во всех браузерах.
      function dropPointShadowSampling(code) {
        return code.replace(/textureSampleCompareLevel\(\s*\w*point_shadow_textures\b[^;]*\)(?=\s*;)/g, "1.0");
      }
      if (window.GPUDevice) {
        const createShaderModule = GPUDevice.prototype.createShaderModule;
        GPUDevice.prototype.createShaderModule = function (descriptor) {
          if (typeof descriptor?.code === "string") {
            descriptor = { ...descriptor, code: dropPointShadowSampling(inlineHandleLets(descriptor.code)) };
          }
          return createShaderModule.call(this, descriptor);
        };
      }
      // WebKit (Safari, iPhone, iPad) иногда отдаёт пустой ArrayBuffer из getMappedRange буфера,
      // созданного с mappedAtCreation (видели: буфер 260 байт, получено 0) — wgpu падает
      // «RangeError: Length out of range of buffer» при загрузке. Тогда отдаём свою память
      // нужного размера, а при unmap переписываем её в буфер через queue.writeBuffer.
      // Для этого буферам без MAP_READ/MAP_WRITE, созданным отображёнными, добавляется COPY_DST.
      if (window.GPUDevice && window.GPUBuffer) {
        const createBuffer = GPUDevice.prototype.createBuffer;
        const writable = new WeakMap(); // буфер → устройство, чья очередь может в него писать
        const shadows = new WeakMap();  // буфер → [{ offset, data }] своей памяти до unmap
        GPUDevice.prototype.createBuffer = function (descriptor) {
          const mapUsage = GPUBufferUsage.MAP_READ | GPUBufferUsage.MAP_WRITE;
          if (descriptor?.mappedAtCreation && !(descriptor.usage & mapUsage)) {
            descriptor = { ...descriptor, usage: descriptor.usage | GPUBufferUsage.COPY_DST };
            const buffer = createBuffer.call(this, descriptor);
            writable.set(buffer, this);
            return buffer;
          }
          return createBuffer.call(this, descriptor);
        };
        const getMappedRange = GPUBuffer.prototype.getMappedRange;
        GPUBuffer.prototype.getMappedRange = function (offset = 0, size) {
          const range = getMappedRange.call(this, offset, size);
          const wanted = size ?? this.size - offset;
          if (range.byteLength >= wanted || !writable.has(this)) return range;
          const data = new ArrayBuffer(wanted);
          if (!shadows.has(this)) shadows.set(this, []);
          shadows.get(this).push({ offset, data });
          return data;
        };
        const unmap = GPUBuffer.prototype.unmap;
        GPUBuffer.prototype.unmap = function () {
          unmap.call(this);
          const pending = shadows.get(this);
          if (!pending) return;
          shadows.delete(this);
          const queue = writable.get(this).queue;
          for (const { offset, data } of pending) queue.writeBuffer(this, offset, data);
        };
      }
      // Какая видеокарта досталась игре: для текста ошибки на экране загрузки.
      let gpuName = "";
      if (window.GPUAdapter) {
        const requestDevice = GPUAdapter.prototype.requestDevice;
        GPUAdapter.prototype.requestDevice = function (...args) {
          const info = this.info || {};
          gpuName = [info.vendor, info.architecture, info.device, info.description]
            .filter(Boolean).join(" ");
          return requestDevice.apply(this, args);
        };
      }

      // --- Телефоны и планшеты ---
      // Экран телефона плотный (devicePixelRatio 2.5–3.5): рисовать столько пикселей мобильной
      // видеокарте не по силам. Там игра рисует не плотнее 1.5 пикселя на точку и стартует на
      // низком качестве. Качество можно задать и вручную: ?quality=low|medium|high.
      const mobile = navigator.userAgentData?.mobile
        ?? (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
          || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1));
      const asked = new URLSearchParams(location.search).get("quality");
      window.spaceGuardQuality = asked || (mobile ? "low" : "");
      window.spaceGuardMobile = mobile;
      if (mobile && window.devicePixelRatio > 1.5) {
        document.getElementById("viewport").style.setProperty("--scale", String(window.devicePixelRatio / 1.5));
      }

      // --- Учёт загрузки ---
      // Игра грузит ассеты через fetch. Обёртка считает байты каждого ответа по мере прихода;
      // точные размеры файлов — из asset-sizes.json, его пишет scripts/build-web.sh
      // (GitHub Pages сжимает ответы, и content-length не равен размеру файла).
      const nativeFetch = window.fetch.bind(window);
      const loader = {
        sizes: null,          // { wasm, files: { "sfx/a.mp3": байты }, preload: [...] }
        files: new Map(),     // путь от assets -> { kind, size, loaded, done }
        wasm: { size: 0, loaded: 0, done: false },
        current: "",
        listeners: [],
        lastActivity: performance.now(),
        changed() {
          this.lastActivity = performance.now();
          for (const listener of this.listeners) listener();
        },
      };
      window.spaceGuardLoader = loader;

      const kindOf = (path) => path.split("/")[0];

      // Тело ответа с подсчётом байтов. Новый Response отдаёт игре те же данные.
      function counted(response, entry, contentType) {
        if (!response.body) {
          entry.done = true;
          loader.changed();
          return response;
        }
        const reader = response.body.getReader();
        const stream = new ReadableStream({
          async pull(controller) {
            try {
              const { done, value } = await reader.read();
              if (done) {
                entry.done = true;
                if (!entry.size) entry.size = entry.loaded;
                loader.changed();
                controller.close();
                return;
              }
              entry.loaded += value.byteLength;
              loader.changed();
              controller.enqueue(value);
            } catch (error) {
              entry.done = true;
              loader.changed();
              controller.error(error);
            }
          },
          cancel(reason) {
            entry.done = true;
            loader.changed();
            return reader.cancel(reason);
          },
        });
        const headers = new Headers();
        headers.set("Content-Type", contentType || response.headers.get("Content-Type") || "application/octet-stream");
        return new Response(stream, { status: response.status, statusText: response.statusText, headers });
      }

      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        const match = /(?:^|\/)assets\/(.+?)(?:\?.*)?$/.exec(new URL(url, location.href).pathname);
        if (!match) return nativeFetch(input, init);
        const path = decodeURIComponent(match[1]);
        let entry = loader.files.get(path);
        if (!entry) {
          entry = { kind: kindOf(path), size: loader.sizes?.files[path] || 0, loaded: 0, done: false };
          loader.files.set(path, entry);
        } else {
          entry.loaded = 0;
          entry.done = false;
          entry.pending = false;
        }
        loader.current = path;
        loader.changed();
        try {
          const response = await nativeFetch(input, init);
          if (!response.ok) {
            entry.done = true;
            entry.failed = true;
            loader.changed();
            return response;
          }
          return counted(response, entry);
        } catch (error) {
          entry.done = true;
          entry.failed = true;
          loader.changed();
          throw error;
        }
      };

      // Сам модуль игры (WASM) — с подсчётом байтов.
      loader.fetchWasm = async (url) => {
        loader.current = url;
        const response = await nativeFetch(url);
        if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
        return counted(response, loader.wasm, "application/wasm");
      };

      loader.fetchSizes = async () => {
        try {
          const response = await nativeFetch("asset-sizes.json", { cache: "no-cache" });
          loader.sizes = await response.json();
          loader.wasm.size = loader.sizes.wasm || 0;
          for (const [path, entry] of loader.files) entry.size ||= loader.sizes.files[path] || 0;
          // Звуки игра запрашивает все сразу при старте: они известны заранее.
          for (const path of loader.sizes.preload || []) {
            if (!loader.files.has(path)) {
              loader.files.set(path, { kind: kindOf(path), size: loader.sizes.files[path] || 0, loaded: 0, done: false, pending: true });
            }
          }
        } catch {
          loader.sizes = { wasm: 0, files: {}, preload: [] };
        }
        loader.changed();
      };
      loader.resumeAudio = resumeAudio;

      // Паника Rust и ошибки JS: паника приходит в console.error, а игра после неё стоит.
      // Экран загрузки показывает причину, иначе на телефоне без консоли не понять, что случилось.
      loader.errors = [];
      const report = (message) => {
        loader.errors.push(gpuName ? `${message}\nGPU: ${gpuName}` : String(message));
        loader.changed();
      };
      const nativeError = console.error.bind(console);
      console.error = (...args) => {
        const text = args.map(String).join(" ");
        if (text.includes("panicked at")) report(text);
        nativeError(...args);
      };
      // Ошибку рендера Bevy пишет через console.log («Caught rendering error: …» или
      // «Caught DeviceLost error: <причина> <текст>») и после неё останавливает игру.
      let lastRenderError = "";
      const nativeLog = console.log.bind(console);
      console.log = (...args) => {
        const text = String(args[0] ?? "").replace(/%c/g, "");
        const caught = /Caught (rendering|DeviceLost) error: ([\s\S]*)/.exec(text);
        if (caught && !lastRenderError) {
          lastRenderError = caught[1] === "DeviceLost" ? `GPU device lost: ${caught[2]}` : caught[2];
        }
        if (text.includes("Quitting the application")) {
          const quit = /Quitting the application due to (\w+)/.exec(text);
          report(`Rendering error: ${lastRenderError || (quit ? quit[1] : text)}`);
        }
        nativeLog(...args);
      };
      window.addEventListener("error", (event) => report(event.message || event.error));
      window.addEventListener("unhandledrejection", (event) => {
        const text = String(event.reason);
        if (!text.includes("Using exceptions for control flow")) report(text);
      });
    })();
  </script>

  <script type="module">
    import init from "./space_guard.js";

    const loader = window.spaceGuardLoader;
    const canvas = document.getElementById("space-guard");
    const screen = document.getElementById("loader");
    const stage = document.getElementById("stage");
    const percent = document.getElementById("percent");
    const fill = document.getElementById("fill");
    const file = document.getElementById("file");
    const bytes = document.getElementById("bytes");
    const tip = document.getElementById("tip");
    const counts = Object.fromEntries(
      [...document.querySelectorAll("#counts [data-kind]")].map((cell) => [cell.dataset.kind, cell]),
    );

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    // Подсказки — те же, что в меню игры, и несколько правил из неё.
    const tips = [
      "WASD - drive    Mouse - aim",
      "Left button - fire",
      "1-6 or mouse wheel - switch weapon",
      "Hold Space - repair",
      "Esc - pause    Q on pause - graphics quality",
      "Five seconds without damage - the rover repairs itself",
      "Sound on - headphones recommended",
    ];
    let tipIndex = 0;
    function nextTip() {
      tip.classList.add("fade");
      setTimeout(() => {
        tip.textContent = tips[tipIndex++ % tips.length];
        tip.classList.remove("fade");
      }, 400);
    }
    tip.textContent = tips[tipIndex++];
    const tipTimer = setInterval(nextTip, 4500);

    const megabytes = (value) => (value / 1048576).toFixed(1);
    const stageNames = {
      sfx: "Loading sound effects",
      voice: "Loading HQ radio",
      music: "Loading music",
      models: "Loading 3D models",
    };

    let gameStarted = false;  // игра открыла окно и рисует
    let failed = false;
    let ready = false;
    let compiling = false;
    let shown = 0;            // показанная доля: полоса не ползёт назад
    let quietSince = 0;

    function render() {
      if (failed) return;
      if (loader.errors.length) {
        fail(shortError(loader.errors[0]));
        return;
      }
      const files = [...loader.files.values()];
      const total = loader.wasm.size + files.reduce((sum, entry) => sum + (entry.size || entry.loaded), 0);
      const loaded = loader.wasm.loaded + files.reduce((sum, entry) => sum + (entry.done ? (entry.size || entry.loaded) : entry.loaded), 0);
      const share = total > 0 ? Math.min(loaded / total, 1) : 0;
      const cap = ready ? 1 : 0.99;
      shown = Math.max(shown, Math.min(share, cap));
      const value = Math.round(shown * 100);
      percent.textContent = `${value}%`;
      fill.style.width = `${shown * 100}%`;
      bytes.textContent = total ? `${megabytes(loaded)} / ${megabytes(total)} MB` : "";

      for (const [kind, cell] of Object.entries(counts)) {
        const group = files.filter((entry) => entry.kind === kind);
        const done = group.filter((entry) => entry.done).length;
        cell.querySelector("b").textContent = `${done}/${group.length}`;
        cell.classList.toggle("done", group.length > 0 && done === group.length);
      }

      if (ready) {
        stage.textContent = "Ready";
        file.textContent = "All systems online";
      } else if (!loader.wasm.done) {
        stage.textContent = "Loading engine";
        file.textContent = "space_guard_bg.wasm";
      } else if (!gameStarted) {
        stage.textContent = "Starting engine";
        file.textContent = "WebGPU";
      } else if (compiling) {
        // Игра рисует всё, что бывает в бою, заранее: так в бою нет фризов на первом взрыве.
        stage.textContent = "Compiling shaders";
        file.textContent = "Warming up every effect so the battle runs smooth";
      } else {
        const kind = loader.current.split("/")[0];
        stage.textContent = stageNames[kind] || "Loading";
        file.textContent = loader.current;
      }
    }

    // Готово, когда игра рисует, все звуки пришли и новых запросов нет полсекунды.
    function checkReady() {
      if (ready || failed || !gameStarted || !loader.sizes) return;
      const now = performance.now();
      // Страховка: файл, который игра так и не запросила, не держит экран дольше 5 с тишины.
      const stalled = now - loader.lastActivity > 5000;
      const busy = [...loader.files.values()].some((entry) => !entry.done && !(stalled && entry.pending));
      if (busy) {
        quietSince = 0;
        return;
      }
      // Файлы пришли, а игра ещё готовится: модели, шейдеры (src/loading.rs пишет spaceGuardWarm).
      const warm = window.spaceGuardWarm === true;
      if (compiling !== !warm) {
        compiling = !warm;
        render();
      }
      if (!warm) {
        quietSince = 0;
        return;
      }
      if (!quietSince) quietSince = now;
      if (now - quietSince < 600) return;
      ready = true;
      screen.classList.add("ready");
      render();
    }

    let frame = 0;
    loader.listeners.push(() => {
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); });
    });
    setInterval(checkReady, 200);

    // Сторож: движок скачан, а окно игры так и не открылось.
    setInterval(() => {
      if (!failed && loader.wasm.done && !gameStarted && performance.now() - loader.lastActivity > 30000) {
        fail("The engine did not start. Your browser or device may not support everything the game needs (WebGPU).");
      }
    }, 1000);

    // Игра проставляет холсту размер, когда открывает окно: дальше фон экрана — размытая игра.
    new MutationObserver(() => {
      if (gameStarted) return;
      gameStarted = true;
      screen.classList.add("live");
      render();
    }).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });

    // Первые строки паники: где упало и почему, без стека.
    function shortError(text) {
      const lines = text.split("\n").map((line) => line.trim()).filter(Boolean);
      const body = lines.filter((line) => !/^(Stack:|Error$|at )/.test(line)).slice(0, 3).join(" ");
      return body.replace(/^panicked at [^:]*\/src\//, "panicked at ").slice(0, 400);
    }

    function fail(message) {
      failed = true;
      screen.classList.add("failed");
      stage.textContent = "Cannot start";
      file.textContent = message;
      file.style.whiteSpace = "normal";
      percent.textContent = "";
      clearInterval(tipTimer);
      tip.textContent = "";
    }


    // --- Полный экран ---
    // Полный экран дают только из обработчика жеста. В него уходит вся страница: холст следует
    // за размером окна сам. Safari на iPad — с префиксом webkit; Safari на iPhone не умеет вовсе:
    // там кнопка подсказывает установку на «Домой» (манифест открывает игру без браузера).
    const root = document.documentElement;
    const fullscreenButton = document.getElementById("fullscreen");
    const installHint = document.getElementById("install-hint");
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
    const canFullscreen = Boolean(root.requestFullscreen || root.webkitRequestFullscreen);
    // Установленная игра: стартовый адрес манифеста помечен ?source=app (display-mode: fullscreen
    // сам по себе не годится — он верен и для окна браузера, развёрнутого на весь экран), на iOS —
    // navigator.standalone.
    const installed = new URLSearchParams(location.search).get("source") === "app"
      || matchMedia("(display-mode: standalone)").matches
      || navigator.standalone === true;
    const iPhone = /iPhone|iPod/.test(navigator.userAgent);

    async function enterFullscreen() {
      if (fullscreenElement() || !canFullscreen) return;
      try {
        if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
        else root.webkitRequestFullscreen();
      } catch {
        return; // Браузер отказал (настройки, встроенный браузер мессенджера): играем в окне.
      }
      // Повернуть горизонтально можно только в полном экране, и то не везде.
      try { await screen.orientation?.lock?.("landscape"); } catch {}
    }

    function exitFullscreen() {
      if (!fullscreenElement()) return;
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }

    let hintTimer = 0;
    function showInstallHint() {
      installHint.classList.add("shown");
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => installHint.classList.remove("shown"), 6000);
    }

    function onFullscreenChange() {
      const on = Boolean(fullscreenElement());
      root.classList.toggle("is-fullscreen", on);
      fullscreenButton.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      fullscreenButton.title = on ? "Exit full screen (hold Esc)" : "Full screen";
      // Esc в игре — пауза. В полном экране Chrome отдаёт его игре, а выход — удержанием Esc
      // (браузер сам об этом подсказывает).
      if (on) navigator.keyboard?.lock?.(["Escape"]).catch(() => {});
      else navigator.keyboard?.unlock?.();
    }
    document.addEventListener("fullscreenchange", onFullscreenChange);
    document.addEventListener("webkitfullscreenchange", onFullscreenChange);

    if (!installed && (canFullscreen || iPhone)) fullscreenButton.hidden = false;
    // Касание кнопки не уходит ни в игру, ни в экран загрузки.
    fullscreenButton.addEventListener("pointerdown", (event) => event.stopPropagation());
    fullscreenButton.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!canFullscreen) showInstallHint();
      else if (fullscreenElement()) exitFullscreen();
      else enterFullscreen();
      fullscreenButton.blur();
      canvas.focus();
    });

    // Закрыть экран: то же нажатие будит звук. Клавиша, закрывшая экран, в игру не идёт.
    function enter() {
      if (!ready) return;
      ready = false;
      loader.resumeAudio();
      // Игра ждёт этого нажатия, чтобы войти в меню (src/loading.rs): меню проявляется под
      // гаснущим экраном загрузки, и звук меню начинается уже разбуженным.
      window.spaceGuardEntered = true;
      // На телефоне и планшете то же касание уводит игру в полный экран и альбомную ориентацию.
      // Касание разрешает полный экран только на отпускании пальца — поэтому ещё и по click ниже.
      if (window.spaceGuardMobile) enterFullscreen();
      screen.classList.add("leaving");
      window.removeEventListener("keydown", onKey, true);
      setTimeout(() => screen.remove(), 800);
      canvas.focus();
    }
    function onKey(event) {
      if (event.metaKey || event.ctrlKey || event.altKey || /^F\d+$/.test(event.key)) return;
      event.stopImmediatePropagation();
      event.preventDefault();
      if (!event.repeat) enter();
    }
    window.addEventListener("keydown", onKey, true);
    screen.addEventListener("pointerdown", enter);
    screen.addEventListener("click", () => {
      if (window.spaceGuardMobile && window.spaceGuardEntered) enterFullscreen();
    });

    render();
    if (!navigator.gpu) {
      fail("This browser has no WebGPU. Open the game in a recent Chrome, Edge or Safari.");
    } else {
      await loader.fetchSizes();
      // Обрыв сети посреди загрузки движка (в Safari — «Load failed») — ещё две попытки.
      const start = (attempt) => {
        loader.wasm.loaded = 0;
        loader.wasm.done = false;
        init({ module_or_path: loader.fetchWasm("space_guard_bg.wasm") }).catch((error) => {
          const text = String(error);
          // Bevy выходит из init через исключение управления потоком: это не ошибка.
          if (text.includes("Using exceptions for control flow")) return;
          if (!gameStarted && attempt < 3 && /Load failed|NetworkError|network|Failed to fetch/i.test(text)) {
            console.warn(`Загрузка движка оборвалась (${text}), попытка ${attempt + 1}`);
            start(attempt + 1);
            return;
          }
          console.error(error);
          fail(text);
        });
      };
      start(1);
    }
  </script>
</body>
</html>
